name: Build Android Artifacts

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Debug & Release APKs
        run: ./gradlew assembleDebug assembleRelease --stacktrace

      - name: Upload Debug Android 26 APK
        uses: actions/upload-artifact@v4
        with:
          name: app-android26-debug
          path: app/build/outputs/apk/android26/debug/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload Debug Android 33 APK
        uses: actions/upload-artifact@v4
        with:
          name: app-android33-debug
          path: app/build/outputs/apk/android33/debug/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload Release Android 26 APK
        uses: actions/upload-artifact@v4
        with:
          name: app-android26-release
          path: app/build/outputs/apk/android26/release/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload Release Android 33 APK
        uses: actions/upload-artifact@v4
        with:
          name: app-android33-release
          path: app/build/outputs/apk/android33/release/*.apk
          if-no-files-found: error
          retention-days: 30
